name: postgres-running-coach

services:
  db:
    image: postgres:16
    container_name: running-coach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-running_coach}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-running_coach}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Disposable Postgres for pytest: in-memory, own port, only started with --profile test.
  db-test:
    image: postgres:16
    container_name: running-coach-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: running_coach_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d running_coach_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
